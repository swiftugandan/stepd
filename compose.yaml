# stepd — server, console and Postgres.
#
#   cp .env.example .env      # then set the two keys; there are no defaults
#   docker compose up -d --build
#   docker compose --profile bootstrap run --rm bootstrap
#
# The last line prints a console URL with a token in it. Tokens are stored as
# hashes, so it is shown once and cannot be recovered afterwards.

name: stepd

services:
  # --------------------------------------------------------------- database
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stepd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stepd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -U and -d, not the bare form: pg_isready defaults to the OS user, which
      # answers "ready" from a server that has not yet created this database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stepd} -d ${POSTGRES_DB:-stepd}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # The engine's serialization points are row-level locks held inside one
    # transaction, so the defaults are the constraint, not the workload.
    command:
      - postgres
      - -c
      - max_connections=200

  # --------------------------------------------------------------- migrations
  # A release step, not a flag on serve. `stepd migrate` must be runnable
  # against a database whose server will not start, and running it once here
  # means N replicas of `serve` do not race to apply the same migration.
  migrate:
    build:
      context: .
      target: runtime
    image: stepd:local
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - STEPD_DATABASE_URL=postgres://${POSTGRES_USER:-stepd}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stepd}
      - STEPD_LOG=${STEPD_LOG:-info}
      - STEPD_LOG_JSON

  # --------------------------------------------------------------- server
  stepd:
    build:
      context: .
      target: runtime
    image: stepd:local
    restart: unless-stopped
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${STEPD_PORT:-8080}:8080"
    environment:
      - STEPD_DATABASE_URL=postgres://${POSTGRES_USER:-stepd}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stepd}
      - STEPD_BIND=0.0.0.0:8080

      # `serve` refuses to start without this rather than sending every attempt
      # unsigned, which a conforming app rejects (protocol §9).
      - STEPD_SIGNING_KEY=${STEPD_SIGNING_KEY:?set STEPD_SIGNING_KEY in .env; serve will not start without one}
      # Set during a rotation so both keys verify and the change is not a flag
      # day. Absent when not rotating — see the note on empty values below.
      - STEPD_SIGNING_KEY_PREVIOUS

      # Managed blobs. Empty disables the two transfer endpoints (501) with a
      # warning; it never falls back to a default key, because a capability
      # signed with a guessable key verifies for whoever guessed it.
      - STEPD_BLOB_SIGNING_KEY=${STEPD_BLOB_SIGNING_KEY:-}
      - STEPD_BLOB_ROOT=/var/lib/stepd/blobs
      # The URL apps are handed for upload and download. Correct value depends
      # on where your app runs: http://localhost:8080 for an app on the host,
      # http://stepd:8080 for one on this compose network.
      - STEPD_BLOB_BASE_URL=${STEPD_BLOB_BASE_URL:-http://localhost:8080}
      - STEPD_BLOB_MAX_SIZE=${STEPD_BLOB_MAX_SIZE:-104857600}

      # ---- managed blobs: S3 backend. Unset (the default) keeps the
      # filesystem-plus-relay lines above in force. Uncomment all of these,
      # the `minio` service near the bottom of this file, and set
      # STEPD_BLOB_BACKEND=s3 in .env to presign against it instead — see
      # docs/blob-backends.md before picking a real object store. All four of
      # endpoint, bucket, access key and secret key are required once
      # STEPD_BLOB_BACKEND=s3; `serve` refuses to start on a half-configured
      # one rather than hand out upload URLs against a bucket that half exists.
      #
      # YOUR APP MUST BE ON THIS COMPOSE NETWORK to use the S3 backend here.
      # There is one endpoint, and it is both the address this server calls for
      # HeadObject and the host of every presigned URL the app is handed —
      # `S3Backend::read_url` signs against the bucket built from it. So
      # `minio:9000` is reachable by the server and by a sibling service, and
      # not by an app on the host. `localhost:9000` fails the other way —
      # right for a host app, and resolving to this container for the
      # server. Serving both would need a second, public endpoint to sign
      # with, which is a code change rather than a compose one. The relay path
      # has no such limit — that is what STEPD_BLOB_BASE_URL above is for.
      # - STEPD_BLOB_BACKEND=${STEPD_BLOB_BACKEND:-}
      # - STEPD_BLOB_S3_ENDPOINT=http://minio:9000
      # - STEPD_BLOB_S3_REGION=us-east-1
      # - STEPD_BLOB_S3_BUCKET=stepd
      # - STEPD_BLOB_S3_ACCESS_KEY=${STEPD_BLOB_S3_ACCESS_KEY:-}
      # - STEPD_BLOB_S3_SECRET_KEY=${STEPD_BLOB_S3_SECRET_KEY:-}
      # Read BY VALUE, unlike the egress flags below: "0" here means off. Most
      # self-hosted servers (minio included) need this true; real AWS wants it
      # left unset.
      # - STEPD_BLOB_S3_PATH_STYLE=true

      # ---- egress. These three are read by presence, not by value: setting
      # STEPD_ALLOW_PRIVATE_EGRESS=0 ENABLES private egress. That is why they
      # are bare names here — an unset variable is passed through as absent,
      # whereas `NAME=${NAME:-}` would set it to the empty string and turn the
      # policy on. Uncomment the export in .env to allow them.
      #
      # An app on this compose network has an RFC 1918 address, so it needs
      # STEPD_ALLOW_PRIVATE_EGRESS=1. Cloud metadata stays denied regardless.
      - STEPD_ALLOW_PRIVATE_EGRESS
      - STEPD_ALLOW_LOOPBACK_EGRESS
      - STEPD_EGRESS_ALLOWLIST

      # ---- dispatch. The lease must outlast the attempt: equal values mean a
      # slow-but-healthy app is reclaimed mid-attempt and its step re-executed.
      # The server warns at startup if this inequality is broken.
      - STEPD_ATTEMPT_TIMEOUT_SECONDS=${STEPD_ATTEMPT_TIMEOUT_SECONDS:-60}
      - STEPD_LEASE_SECONDS=${STEPD_LEASE_SECONDS:-150}
      - STEPD_BATCH=${STEPD_BATCH:-16}
      - STEPD_MAX_CONNECTIONS=${STEPD_MAX_CONNECTIONS:-16}
      - STEPD_IDLE_POLL_MS=${STEPD_IDLE_POLL_MS:-250}
      - STEPD_TIMER_JITTER_SECONDS=${STEPD_TIMER_JITTER_SECONDS:-60}

      - STEPD_LOG=${STEPD_LOG:-info}
      - STEPD_LOG_JSON
    volumes:
      - blobs:/var/lib/stepd/blobs
    healthcheck:
      # /v1/health is the one unauthenticated route, and it executes a query —
      # so it fails when the database is gone rather than when the process is.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Longer than STEPD_ATTEMPT_TIMEOUT_SECONDS. SIGTERM makes the server drain
    # in-flight attempts; killing it mid-drain abandons leases that then have to
    # expire, so every deploy would delay the runs it interrupted.
    stop_grace_period: 90s

  # --------------------------------------------------------------- bootstrap
  # One-shot, profile-gated: creates a namespace and mints an admin token.
  #   docker compose --profile bootstrap run --rm bootstrap
  # Both operations are idempotent; each token call mints an additional token.
  bootstrap:
    build:
      context: .
      target: runtime
    image: stepd:local
    profiles: ["bootstrap"]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        stepd namespace "$${STEPD_NAMESPACE}" &&
        stepd token --namespace "$${STEPD_NAMESPACE}" --role admin --name bootstrap
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - STEPD_DATABASE_URL=postgres://${POSTGRES_USER:-stepd}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stepd}
      - STEPD_NAMESPACE=${STEPD_NAMESPACE:-default}
      - STEPD_LOG=${STEPD_LOG:-warn}

  # --------------------------------------------------------------- diagnostics
  #   docker compose --profile ops run --rm doctor
  # Structural, connectivity and blob-store checks against the live database;
  # non-zero exit on anything critical. Runnable against a database whose
  # `serve` will not start — but that only covers S3 credentials or an
  # endpoint that are set and wrong; an S3 backend with a variable missing
  # fails this the same way it fails `serve`, before any of these checks run.
  # Needs the same STEPD_BLOB_S3_* variables as the `stepd` service above if
  # you have uncommented those there, or the bucket-reachability check has
  # nothing to check.
  doctor:
    build:
      context: .
      target: runtime
    image: stepd:local
    profiles: ["ops"]
    restart: "no"
    command: ["doctor"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - STEPD_DATABASE_URL=postgres://${POSTGRES_USER:-stepd}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stepd}
      - STEPD_LOG=${STEPD_LOG:-info}
      # - STEPD_BLOB_BACKEND=${STEPD_BLOB_BACKEND:-}
      # - STEPD_BLOB_S3_ENDPOINT=http://minio:9000
      # - STEPD_BLOB_S3_REGION=us-east-1
      # - STEPD_BLOB_S3_BUCKET=stepd
      # - STEPD_BLOB_S3_ACCESS_KEY=${STEPD_BLOB_S3_ACCESS_KEY:-}
      # - STEPD_BLOB_S3_SECRET_KEY=${STEPD_BLOB_S3_SECRET_KEY:-}
      # - STEPD_BLOB_S3_PATH_STYLE=true

  # --------------------------------------------------------------- your app
  # The execution model is push: the server calls your application's endpoint,
  # so the app must be reachable from the stepd container and both sides must
  # hold the same STEPD_SIGNING_KEY.
  #
  # app:
  #   build: ./your-app
  #   restart: unless-stopped
  #   environment:
  #     - STEPD_SIGNING_KEY=${STEPD_SIGNING_KEY}
  #   expose: ["9944"]
  #
  # Then register it, with STEPD_ALLOW_PRIVATE_EGRESS set on the stepd service:
  #   curl -X PUT http://localhost:8080/v1/apps \
  #     -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
  #     -d '{"url":"http://app:9944", ...}'

  # --------------------------------------------------------- object storage
  # Commented out: the default `docker compose up` stays the two-service
  # stack (plus this server) described in README.md, not a third container
  # nobody asked for. Uncomment this and the matching STEPD_BLOB_S3_* lines
  # on the `stepd` and `doctor` services above to try the S3 backend locally.
  # Read docs/blob-backends.md first — not every S3-compatible server
  # actually enforces the checksum this backend's presigned uploads rely on.
  #
  # Pinned to the release docs/blob-backends.md actually tested, like every
  # other image in this file. `:latest` on an object store is the tag most
  # worth not floating: the property this backend depends on — the server
  # rejecting a PUT whose body does not match the signed
  # x-amz-checksum-sha256 — is one a release could change, and the table in
  # that note would then be recording a server nobody is running.
  # minio:
  #   image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
  #   restart: unless-stopped
  #   command: ["server", "/data"]
  #   environment:
  #     MINIO_ROOT_USER: ${STEPD_BLOB_S3_ACCESS_KEY:?set STEPD_BLOB_S3_ACCESS_KEY in .env}
  #     MINIO_ROOT_PASSWORD: ${STEPD_BLOB_S3_SECRET_KEY:?set STEPD_BLOB_S3_SECRET_KEY in .env}
  #   volumes:
  #     - minio-data:/data
  #   # Published so you can inspect the bucket from the host — `mc alias set`
  #   # against 127.0.0.1:9000, or the console. It does NOT make presigned URLs
  #   # usable by an app on the host: those carry whatever
  #   # STEPD_BLOB_S3_ENDPOINT says, and the server needs that to be
  #   # `minio:9000`. See the note on the `stepd` service above.
  #   ports:
  #     - "9000:9000"
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20
  #     start_period: 10s
  #
  # This backend never creates the bucket itself (`stepd-blobs-s3`'s module
  # docs), so something has to before `serve` will accept an upload. Run this
  # once the minio service is up:
  #   docker compose exec minio sh -c \
  #     'mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && \
  #      mc mb -p local/stepd'
  #
  # `exec`, not `run --profile ops`: this service declares no profiles, so
  # naming one selects nothing. Both `curl` and `mc` are in the image above —
  # checked, not assumed — and the `local` alias it ships points at
  # localhost:9000 with no credentials, which is why `mc alias set` re-points
  # it at the container's own port with the root user rather than at the
  # service name over the compose network.

volumes:
  pgdata:
  # Bytes behind every $blob reference in a live run's journal. Losing this
  # volume fails those runs on their next replay, hours later, with a missing
  # object — so it is a named volume, not a container-local path.
  blobs:
  # Commented out with the `minio` service above; uncomment together.
  # minio-data:
