[workspace]
resolver = "2"
members = [
  "crates/stepd-proto",
  "crates/stepd-core",
  "crates/stepd-store-postgres",
  "crates/stepd-blobs-s3",
  "crates/stepd-sdk-core",
  "crates/stepd-sdk",
  "crates/stepd-expr-cel",
  "crates/stepd-transport-http",
  "crates/stepd-server",
  "crates/stepd-cli",
  "crates/stepd-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stepd-dev/stepd"
rust-version = "1.85"   # Waker::noop, used by the SDK test harness so a workflow test needs no runtime

[workspace.dependencies]
stepd-proto = { path = "crates/stepd-proto", version = "0.1.0" }
stepd-core  = { path = "crates/stepd-core",  version = "0.1.0" }
stepd-store-postgres = { path = "crates/stepd-store-postgres", version = "0.1.0" }
stepd-blobs-s3 = { path = "crates/stepd-blobs-s3", version = "0.1.0" }
stepd-sdk-core = { path = "crates/stepd-sdk-core", version = "0.1.0" }
stepd-sdk    = { path = "crates/stepd-sdk",  version = "0.1.0" }
stepd-server = { path = "crates/stepd-server", version = "0.1.0" }
stepd-expr-cel = { path = "crates/stepd-expr-cel", version = "0.1.0" }
stepd-transport-http = { path = "crates/stepd-transport-http", version = "0.1.0" }
stepd-conformance = { path = "crates/stepd-conformance", version = "0.1.0" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4", "v7", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
chrono-tz  = "0.10"
thiserror  = "1"
anyhow     = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
tokio      = { version = "1", features = ["full"] }
axum       = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx       = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "uuid", "chrono", "migrate"] }
sha2       = "0.10"
hmac       = "0.12"
hex        = "0.4"
subtle     = "2"
reqwest    = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
clap       = { version = "4", features = ["derive", "env"] }
rand       = "0.8"
humantime  = "2"
futures    = "0.3"
tempfile   = "3"
base64     = "0.22"
url        = "2"
# Sans-IO SigV4 signer for the S3 blob backend. It sends nothing itself, which
# is why presigning a read URL can stay synchronous. Only the signer is wanted,
# so the default `full` feature set is off: it pulls an XML parser, an MD5
# implementation and serde for API surface this workspace never calls, and each
# one is another licence to justify in `deny.toml`. `rustcrypto` is the crypto
# backend; without one of the three the crate refuses to compile at all.
rusty-s3   = { version = "0.10", default-features = false, features = ["rustcrypto"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
